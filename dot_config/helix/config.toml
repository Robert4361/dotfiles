theme = "catppuccin_mocha"
[editor]
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "multiple"
# Minimum severity to show a diagnostic after the end of a line
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
character = "╎"
render = true

[keys.normal.space]
e = [
  ":sh rm -f /tmp/unique-file-h21a434",
  ":insert-output yazi '%{buffer_name}' --chooser-file=/tmp/unique-file-h21a434",
  ":insert-output echo \"x1b[?1049h\" > /dev/tty",
  ":open %sh{cat /tmp/unique-file-h21a434}",
  ":redraw",
]

[keys.normal]
"=" = ":format"
"A-," = "goto_previous_buffer"
"A-." = "goto_next_buffer"
"H" = "goto_previous_buffer"
"L" = "goto_next_buffer"
"A-w" = ":buffer-close"
"A-/" = "repeat_last_motion"
"A-x" = "extend_to_line_bounds"
"X" = "select_line_above"
"}" = "goto_prev_paragraph"
"{" = "goto_next_paragraph"
C-g = [
    ":write-all",
    ":insert-output lazygit >/dev/tty",
    ":redraw",
    ":reload-all"
]

C-r = [
    ":write-all",
    ":insert-output scooter >/dev/tty",
    ":redraw",
    ":reload-all"
]

C-k = [
  "extend_to_line_bounds",
  "delete_selection",
  "move_line_up",
  "paste_before",
]

C-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
# Open languages.toml config
tab.l = ":o ~/.config/helix/languages.toml"
# Open Helix config
tab.c = ":config-open"
A-r = [":config-reload", ":reload"]

[keys.select]
"A-x" = "extend_to_line_bounds"
"X" = "select_line_above"

[editor.statusline]
left = [
  "mode",
  "spinner",
  "version-control",
  "spacer",
  "file-name",
]

separator = "│"
[editor.lsp]
# Show LSP messages in the status line
display-messages = true

[editor.inline-diagnostics]
cursor-line = "hint" # Show inline diagnostics when the cursor is on the line
other-lines = "warning"

[editor.auto-save]
after-delay.timeout = 100
focus-lost=true
after-delay.enable = true

